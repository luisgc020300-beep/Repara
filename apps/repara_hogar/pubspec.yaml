name: repara_hogar
description: "REPARA Hogar — la app del propietario, lado de la separación Hogar/Pro."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Paquetes compartidos con REPARA Pro -- nunca al revés.
  repara_core:
    path: ../../packages/repara_core
  repara_ui:
    path: ../../packages/repara_ui

  cupertino_icons: ^1.0.8

  # Bootstrap de Firebase (mismo proyecto compartido repara-hogar-app, ver
  # README.md) y resto de servicios exclusivos de Hogar -- mismas versiones
  # que la app principal.
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  firebase_app_check: ^0.4.3
  firebase_crashlytics: ^5.0.0
  firebase_storage: ^13.0.5
  firebase_messaging: ^16.0.3
  cloud_firestore: ^6.1.2
  cloud_functions: 6.0.7
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  pdf: ^3.12.0
  printing: ^5.14.3
  http: ^1.6.0
  cached_network_image: ^3.4.1
  # Fijado por debajo de 2.2.0 a propósito: desde esa versión el paquete exige
  # Flutter >=3.44.0 y este proyecto usa 3.38.9 -- 2.0.0/2.1.0 ya traen la
  # reescritura que arregla el crash de arranque en iOS (ver informe nov 2026:
  # register(with:) de la 1.1.9+2 hacía force-unwrap de rootViewController).
  flutter_contacts: ">=2.0.0 <2.2.0"
  # Gate biométrico de documentos sensibles (repara_core/biometric_service.dart,
  # documento_gate.dart -- noviembre 2026) -- mismas versiones que la app
  # principal.
  local_auth: ^2.3.0
  local_auth_platform_interface: ^1.1.0
  flutter_secure_storage: ^9.2.2

# Mismo conflicto que packages/repara_ui/pubspec.yaml y apps/repara_pro
# (ver sus comentarios): pdf 3.12.0 resuelve a image 4.11.0 dentro de un
# grafo de dependencias pequeño, incompatible con archive 4.0.9.
dependency_overrides:
  image: 4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Mismo icono que el monolito, reutilizado tal cual (CEO, noviembre 2026).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F7F3EC"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
