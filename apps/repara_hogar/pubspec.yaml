name: repara_hogar
description: "REPARA Hogar — la app del propietario, lado de la separación Hogar/Pro."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Paquetes compartidos con REPARA Pro -- nunca al revés.
  repara_core:
    path: ../../packages/repara_core
  repara_ui:
    path: ../../packages/repara_ui

  cupertino_icons: ^1.0.8

  # Bootstrap de Firebase (mismo proyecto compartido repara-hogar-app, ver
  # README.md) y resto de servicios exclusivos de Hogar -- mismas versiones
  # que la app principal.
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  firebase_app_check: ^0.4.3
  firebase_crashlytics: ^5.0.0
  firebase_storage: ^13.0.5
  firebase_messaging: ^16.0.3
  cloud_firestore: ^6.1.2
  cloud_functions: 6.0.7
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  pdf: ^3.12.0
  printing: ^5.14.3
  http: ^1.6.0
  cached_network_image: ^3.4.1
  flutter_contacts: ^1.1.9+2

# Mismo conflicto que packages/repara_ui/pubspec.yaml y apps/repara_pro
# (ver sus comentarios): pdf 3.12.0 resuelve a image 4.11.0 dentro de un
# grafo de dependencias pequeño, incompatible con archive 4.0.9.
dependency_overrides:
  image: 4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
