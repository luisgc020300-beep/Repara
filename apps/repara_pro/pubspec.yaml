name: repara_pro
description: "REPARA Pro — la app del profesional, lado de la separación Hogar/Pro."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Paquetes compartidos con REPARA Hogar -- nunca al revés.
  repara_core:
    path: ../../packages/repara_core
  repara_ui:
    path: ../../packages/repara_ui

  cupertino_icons: ^1.0.8

  # Bootstrap de Firebase (mismo proyecto compartido repara-hogar-app, ver
  # README.md) -- misma versión que la app principal.
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  firebase_app_check: ^0.4.3
  firebase_crashlytics: ^5.0.0
  cloud_firestore: ^6.1.2
  cloud_functions: 6.0.7
  # main.dart apunta Storage al emulador en modo USE_EMULATOR (documentos
  # subidos por el profesional, ver DocumentoService en repara_core) --
  # misma versión que la app principal.
  firebase_storage: ^13.0.5
  intl: ^0.20.2
  # trabajo_profesional_sheet.dart/inicio_pro_tab.dart (código de invitación
  # a compartir) -- misma versión que la app principal.
  share_plus: ^10.1.4
  # control_economico_pro_tab.dart (gráfica de ingresos) -- misma versión
  # que la app principal.
  fl_chart: ^0.69.2
  # Gate biométrico de documentos sensibles (repara_core/biometric_service.dart,
  # documento_gate.dart -- noviembre 2026) -- mismas versiones que la app
  # principal.
  local_auth: ^2.3.0
  local_auth_platform_interface: ^1.1.0
  flutter_secure_storage: ^9.2.2

# Mismo conflicto que packages/repara_ui/pubspec.yaml (ver su comentario):
# dentro del grafo de dependencias más pequeño de esta app, pdf 3.12.0
# resuelve a image 4.11.0, incompatible con archive 4.0.9
# (ZLibDecoder.decodeLazy no existe ahí) -- se fija la misma versión que ya
# usa el resto del monorepo.
dependency_overrides:
  image: 4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.1.0
  flutter_launcher_icons: ^0.14.4

# Icono propio de Pro (CEO, noviembre 2026): llave inglesa geométrica de
# doble boca, mismo lenguaje de trazos rectilíneos que el icono de
# Hogar/monolito, en el navy actual de marca (ReparaColors.light.brandStrong,
# ver design_tokens.dart) sobre el mismo crema cálido de fondo.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F7F3EC"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
