name: repara
description: "Repara — la memoria digital de tu vivienda."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase — mismas versiones que RiskRunner/Convive (mismo desarrollador,
  # mismo stack) para mantener consistencia entre los tres proyectos.
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  cloud_functions: 6.0.7
  firebase_storage: ^13.0.5
  firebase_crashlytics: ^5.0.0
  firebase_app_check: ^0.4.3
  firebase_core_web: ^3.4.0

  google_fonts: ^6.2.1
  get_it: ^8.0.2
  shared_preferences: ^2.3.0
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.1.0

flutter:
  uses-material-design: true
