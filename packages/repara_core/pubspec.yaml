name: repara_core
description: >
  Modelos, servicios y utilidades compartidos entre REPARA (Hogar) y REPARA
  Pro. Paquete sin UI propia -- ninguna pantalla ni widget de composición
  visual completo vive aquí, solo lo que las dos apps necesitan leer o
  escribir igual.
publish_to: 'none'

version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # stream_error_logging.dart (Grupo 1 de la Fase 1) -- misma versión que la
  # app principal para evitar divergencia de dependencias compartidas.
  firebase_crashlytics: ^5.0.0
  # Modelos de dominio (Grupo 2 de la Fase 1) -- misma versión que la app
  # principal.
  cloud_firestore: ^6.1.2
  # Servicios compartidos (Grupo 3 de la Fase 1) -- mismas versiones que la
  # app principal.
  cloud_functions: 6.0.7
  firebase_auth: ^6.1.4
  firebase_storage: ^13.0.5
  # analytics_service.dart (Grupo 4 de la Fase 1) -- misma versión que la
  # app principal.
  firebase_analytics: ^12.1.0
  # conceptos_frecuentes_service.dart (Fase 2, preparación repara_ui,
  # noviembre 2026) -- misma versión que la app principal.
  shared_preferences: ^2.3.0
  # biometric_service.dart / documento_gate.dart (gate de documentos
  # sensibles, extraído del monolito a este paquete en noviembre 2026 para
  # que Hogar y Pro lo reutilicen sin duplicarlo) -- mismas versiones que la
  # app principal.
  local_auth: ^2.3.0
  # paquete de tipos compartido de local_auth, no una dependencia transitiva
  # -- LocalAuthException/LocalAuthExceptionCode se importan directamente.
  local_auth_platform_interface: ^1.1.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Paquete puro de lógica -- sin assets ni plugins nativos propios.
