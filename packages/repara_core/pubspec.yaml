name: repara_core
description: >
  Modelos, servicios y utilidades compartidos entre REPARA (Hogar) y REPARA
  Pro. Paquete sin UI propia -- ninguna pantalla ni widget de composición
  visual completo vive aquí, solo lo que las dos apps necesitan leer o
  escribir igual.
publish_to: 'none'

version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # stream_error_logging.dart (Grupo 1 de la Fase 1) -- misma versión que la
  # app principal para evitar divergencia de dependencias compartidas.
  firebase_crashlytics: ^5.0.0
  # Modelos de dominio (Grupo 2 de la Fase 1) -- misma versión que la app
  # principal.
  cloud_firestore: ^6.1.2
  # Servicios compartidos (Grupo 3 de la Fase 1) -- mismas versiones que la
  # app principal.
  cloud_functions: 6.0.7
  firebase_auth: ^6.1.4
  firebase_storage: ^13.0.5
  # analytics_service.dart (Grupo 4 de la Fase 1) -- misma versión que la
  # app principal.
  firebase_analytics: ^12.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Paquete puro de lógica -- sin assets ni plugins nativos propios.
