name: repara_ui
description: >
  Widgets y componentes visuales compartidos entre REPARA (Hogar) y REPARA
  Pro. Depende de repara_core para modelos y tokens de diseño -- nunca al
  revés -- y no importa nada de lib/ ni de apps/: lo que arrastra esa
  dependencia se queda en su app.
publish_to: 'none'

version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  repara_core:
    path: ../repara_core

  # app_error.dart (Fase 2B.2) -- misma versión que la app principal.
  firebase_crashlytics: ^5.0.0
  # ios_list.dart y miniatura_documento.dart (Fase 2B.2/2B.3) -- misma
  # versión que la app principal.
  cached_network_image: ^3.4.1
  # abrir_protegido.dart (Fase 2B.3) -- misma versión que la app principal.
  url_launcher: ^6.3.1
  # pagos_section.dart, pago_detail_screen.dart, cambio_alcance_section.dart
  # (Fase 2B.4) -- mismas versiones que la app principal.
  intl: ^0.20.2
  cloud_functions: 6.0.7
  image_picker: ^1.1.2
  # presupuestos_section.dart (plantilla local) y presupuesto_pdf.dart/
  # pdf_fuente_unicode.dart (Fase 2B.5) -- mismas versiones que la app
  # principal.
  shared_preferences: ^2.3.0
  pdf: ^3.12.0
  printing: ^5.14.3

# pdf 3.12.0 depende de archive 4.0.9 Y de image (sin fijar versión) --
# dentro del grafo de dependencias más pequeño de este paquete (menos
# paquetes que en la app principal, que fuerzan techos más bajos en otras
# ramas), el resolutor elige image 4.11.0, que ya no es compatible con esa
# versión de archive (ZLibDecoder.decodeLazy no existe ahí) y rompe la
# carga de CUALQUIER test que toque el paquete pdf, incluido
# presupuesto_pdf_test.dart. En la app principal el grafo completo resuelve
# a image 4.10.1, que sí es compatible -- se fija aquí la misma versión
# para no depender de qué otros paquetes haya alrededor.
dependency_overrides:
  image: 4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Fake de UrlLauncherPlatform en los tests de abrir_protegido.dart/
  # miniatura_documento.dart -- transitiva de url_launcher, declarada aquí
  # porque se importa directamente.
  url_launcher_platform_interface: ^2.3.2
  # Firestore falso en los tests de pagos_section.dart/pago_detail_screen.
  # dart/cambio_alcance_section.dart -- mismas versiones que la app
  # principal; cloud_firestore se usa directamente para Timestamp.
  fake_cloud_firestore: ^4.1.0
  cloud_firestore: ^6.1.2

flutter:
  # Fuente Unicode para los PDF con "€" (ver pdf_fuente_unicode.dart) --
  # único asset propio del paquete.
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
