name: repara_ui
description: >
  Widgets y componentes visuales compartidos entre REPARA (Hogar) y REPARA
  Pro. Depende de repara_core para modelos y tokens de diseño -- nunca al
  revés -- y no importa nada de lib/ ni de apps/: lo que arrastra esa
  dependencia se queda en su app.
publish_to: 'none'

version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  repara_core:
    path: ../repara_core

  # app_error.dart (Fase 2B.2) -- misma versión que la app principal.
  firebase_crashlytics: ^5.0.0
  # ios_list.dart y miniatura_documento.dart (Fase 2B.2/2B.3) -- misma
  # versión que la app principal.
  cached_network_image: ^3.4.1
  # abrir_protegido.dart (Fase 2B.3) -- misma versión que la app principal.
  url_launcher: ^6.3.1
  # pagos_section.dart, pago_detail_screen.dart, cambio_alcance_section.dart
  # (Fase 2B.4) -- mismas versiones que la app principal.
  intl: ^0.20.2
  cloud_functions: 6.0.7
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Fake de UrlLauncherPlatform en los tests de abrir_protegido.dart/
  # miniatura_documento.dart -- transitiva de url_launcher, declarada aquí
  # porque se importa directamente.
  url_launcher_platform_interface: ^2.3.2
  # Firestore falso en los tests de pagos_section.dart/pago_detail_screen.
  # dart/cambio_alcance_section.dart -- mismas versiones que la app
  # principal; cloud_firestore se usa directamente para Timestamp.
  fake_cloud_firestore: ^4.1.0
  cloud_firestore: ^6.1.2

flutter:
  # Paquete de widgets puros -- sin assets propios.
